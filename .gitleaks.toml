# Generated by scripts/cb-git-hooks.sh in core-blockchain-workspace (CB-3886). Do not edit:
# change .agents/skills/cb-secrets-scan/config/gitleaks.toml there and re-render.
# False positives: add the fingerprint to .gitleaksignore, or `gitleaks:allow` on the line.
title = "cb-secrets-scan"
[extend]
useDefault = true
disabledRules = ["generic-api-key"]

[[allowlists]]
description = "third-party clones, build output, and this skill's own data (finding IDs, checked by `secscan.py check`)"
paths = ['''(^|/)\.agents/skills/cb-secrets-scan/data/''', '''(^|/)core-blockchain-ai-agent-rust/workspace/''', '''^target/''', '''(^|/)\.angular/cache/''', '''^node_modules/''']

[[rules]]
id = "cb-private-key-header"
description = "private key header (does not require END, catches partially modified key diffs)"
regex = '''-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----'''
keywords = ["private key"]

[[rules]]
id = "cb-google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z_\-]{35}'''
keywords = ["aiza"]

[[rules]]
id = "cb-password-short"
description = "password-named key with a literal value of 6+ chars (weak DB passwords)"
regex = '''(?i)["']?[a-z0-9_.-]*(?:password|passwd|pwd)[a-z0-9_.-]*["']?\s*[:=]\s*["']([^"'\s$<>{}]{6,})["']'''
secretGroup = 1
keywords = ["password","passwd","pwd"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(password|passwd|changeme|example|placeholder|xxxxxx+|\*+|your[_-]?[a-z_-]*(here|password|pass|pwd)|none|null|true|false|string)$''']

[[rules]]
id = "cb-wea-difft-credential"
description = "Wea/Difft key, secret or webhook with a literal value"
regex = '''(?i)["']?(?:wea|difft)[a-z0-9_.-]*(?:key|secret|token|webhook[a-z]*|appid)["']?\s*[:=]\s*["']([^"'\s$<>{}]{6,})["']'''
secretGroup = 1
keywords = ["wea","difft"]
# Whole-value placeholders only (README examples such as "your-app-secret").
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(changeme|example|placeholder|xxxxxx+|\*+|your[_-]?[a-z_-]*(here|key|secret|token)|none|null|true|false|string)$''']

[[rules]]
id = "cb-wallet-key"
description = "wallet private key / seed / mnemonic / keypair under a key-like name"
# Only the name is case-insensitive: a global (?i) would let the base58 class take O, I and l.
# S[A-Z2-7]{55} is a Stellar secret seed (base32), which the base58 class does not cover.
regex = '''(?i:["']?[a-z0-9_.-]*(?:priv(?:ate)?[_-]?key|secret[_-]?key|seed|mnemonic|keypair|signer[_-]?key|wif)[a-z0-9_.-]*["']?)\s*[:=]\s*["'\[]?((?:0x)?[0-9a-fA-F]{64}|[1-9A-HJ-NP-Za-km-z]{50,90}|S[A-Z2-7]{55}|(?:\d{1,3}\s*,\s*){31,}\d{1,3}|(?:[a-z]{3,8}\s+){11,23}[a-z]{3,8})'''
secretGroup = 1
keywords = ["priv","secret","seed","mnemonic","keypair","signer","wif"]

[[rules]]
id = "cb-url-userinfo-password"
description = "password in URL userinfo (scheme://user:pass@host, or scheme://:pass@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]{1,20}://[^/\s:@"'<>]{0,64}:([^@\s/"'<>]{3,128})@[A-Za-z0-9.-]'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(\$\{?[A-Z_]+\}?|<[^>]*>|\{\{.*\}\}|password|passwd|pass|pwd|secret|changeme|xxx+|\*+|user|token|example)$''']

[[rules]]
id = "cb-url-provider-key"
description = "RPC / API provider key in URL path"
regex = '''(?i)(?:infura\.io/v3|infura\.io/ws/v3|alchemy\.com/v2|alchemyapi\.io/v2|g\.alchemy\.com/v2|g\.alchemy\.com/nft/v2|quiknode\.pro|getblock\.io/[a-z0-9-]+|blastapi\.io|ankr\.com/[a-z0-9_]+|chainstack\.com|nodereal\.io/v1|drpc\.org/(?:[a-z0-9_-]+/)*|blockfrost\.io/api/v0/[a-z]+|tatum\.io/v3|nownodes\.io|moralis\.io/(?:[a-z0-9]+/)*|helius-rpc\.com/\?api-key=|rpc\.helius\.xyz/\?api-key=|trongrid\.io|tronscan\.org|etherscan\.io/api\?[^"'\s]*apikey=|bscscan\.com/api\?[^"'\s]*apikey=|subscan\.io)/?([A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["infura","alchemy","quiknode","getblock","blastapi","ankr","chainstack","nodereal","drpc","blockfrost","tatum","nownodes","moralis","helius","trongrid","tronscan","etherscan","bscscan","subscan"]
# Whole-value placeholders only (YOUR_ALCHEMY_KEY, xxxxxxxx...).
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^((your|example|placeholder)[a-z_-]*|x{4,}[a-z_-]*)$''']

[[rules]]
id = "cb-url-query-key"
description = "credential in URL query parameter"
regex = '''(?i)[?&](?:api[_-]?key|apikey|token|access[_-]?token|auth|auth[_-]?token|secret|client[_-]?secret|password|pwd|sig|signature|x-api-key)=([A-Za-z0-9_\-.~%+/]{12,})'''
secretGroup = 1
keywords = ["key=","token=","auth=","secret=","password=","pwd=","sig=","signature="]
[[rules.allowlists]]
regexTarget = "secret"
# Whole-value placeholders only: a real value that merely contains "example" is still a finding.
regexes = ['''(?i)^(\$\{.*|%7B.*|<.*|\{\{.*|(your|example|placeholder)[a-z_-]*|x{4,}[a-z_-]*)$''']

