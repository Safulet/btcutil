# Generated by scripts/cb-git-hooks.sh render-ci in core-blockchain-workspace (CB-3886).
# Backstop for the local pre-commit hook: a commit made with --no-verify, on a machine without the
# hook, or pushed with --no-verify / git send-pack (which skip the push scan) fails here. A hit means the secret
# is already on GitHub, so rotate it as well as removing it. Make this check required in the branch
# protection, or it blocks nothing. See docs/security/pre-commit-gitleaks.md in
# core-blockchain-workspace.
name: gitleaks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR replaces the run still in progress.
concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # A hung download or scan must not hold a self-hosted runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (pinned SHA-256)
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the commits of this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::commit $sha is not in the checkout; cannot scan this PR"; exit 1
            fi
          done
          # The ruleset comes from the base branch, so a PR cannot loosen it for itself. Only the PR
          # that first adds .gitleaks.toml (none on the base commit, which exists) uses its own copy.
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" >"$RUNNER_TEMP/gitleaks.toml"; echo "ruleset: base branch"
          else
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"; echo "ruleset: this PR (not on the base branch yet)"
          fi
          # --text: scan files marked binary or -diff too. -m: show what each merge commit adds.
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v -c "$RUNNER_TEMP/gitleaks.toml" \
            --log-opts="--text -m $BASE_SHA..$HEAD_SHA" . 2>"$RUNNER_TEMP/gitleaks.err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/gitleaks.err" >&2
          # gitleaks exits 0 when git fails or writes to stderr: treat that as a failure.
          # "0 commits scanned" only: a bare "0 commits" pattern would also match 10, 20, 100 ...
          if [ "$rc" -eq 0 ] && grep -qE 'ERR|(^|[^0-9])0 commits scanned' "$RUNNER_TEMP/gitleaks.err"; then
            echo "::error::gitleaks did not scan this PR's commits (see the log above)"; exit 1
          fi
          exit "$rc"
