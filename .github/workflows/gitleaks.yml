# Generated by scripts/cb-git-hooks.sh render-ci in core-blockchain-workspace (CB-3886).
# Backstop for the local hooks: scans every commit of a pull request, so a commit that skipped the
# local scan (--no-verify push, git send-pack, a machine without the hook) fails here before merge.
# Only commits that reach a PR are scanned; a direct push to a branch is not (cb-secrets-scan's
# periodic run covers that). A hit means the secret is already on GitHub: rotate it as well as
# removing it. Make this check required in the branch protection, or it blocks nothing; this file
# and .gitleaks.toml run from the PR, so a change to them needs a careful review. See
# docs/security/pre-commit-gitleaks.md in core-blockchain-workspace.
name: gitleaks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR replaces the run still in progress.
concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # A GitHub-hosted runner for every PR: the workflow file runs from the PR, so it must never run
    # on our own machines, and the scan needs nothing they have.
    runs-on: ubuntu-latest
    # A hung download or scan must not hold a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (pinned SHA-256)
        run: |
          set -eu
          # The pinned binary is linux/x64: say so plainly on any other runner.
          [ "$(uname -s)-$(uname -m)" = Linux-x86_64 ] || { echo "::error::this check needs a linux x86_64 runner, not $(uname -s)-$(uname -m)"; exit 1; }
          cd "$RUNNER_TEMP"
          curl -sSfL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the commits of this PR
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Actions runs bash: a failing command inside a pipeline fails the step too.
          if [ -n "${BASH_VERSION:-}" ]; then set -o pipefail; fi
          # The PR's own changes are only streamed, never written; what this step does write (the redacted
          # report and log) is removed when it ends.
          trap 'rm -f "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/report.min" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/gitleaks.err" "$RUNNER_TEMP/gitleaks.log"' EXIT
          # The scan step of the gitleaks PR check (CB-3886). render-ci copies it into the workflow;
          # scripts/test-gitleaks-ci-scan.sh runs it against fake gitleaks binaries.
          # Needs BASE_SHA, HEAD_SHA, RUNNER_TEMP (holding the gitleaks binary), and the repo checkout as $PWD.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            case "$sha" in *[!0-9a-f]*|'') echo "::error::not a commit id: '$sha'"; exit 1 ;; esac
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::commit $sha is not in the checkout; cannot scan this PR"; exit 1
            fi
          done
          # --diff-merges=remerge needs git 2.36.
          gmaj=$(git version | sed -n 's/^git version \([0-9]*\)\..*/\1/p')
          gmin=$(git version | sed -n 's/^git version [0-9]*\.\([0-9]*\).*/\1/p')   # "2.36" and "2.36.1" both read 36
          if [ -z "$gmaj" ] || [ -z "$gmin" ] || [ "$gmaj" -lt 2 ] || { [ "$gmaj" -eq 2 ] && [ "$gmin" -lt 36 ]; }; then
            echo "::error::this check needs git 2.36 or later; the runner has '$(git version)'"; exit 1
          fi
          # The log checks below read this version's wording; a different binary is an error, not a guess.
          gv=$("$RUNNER_TEMP/gitleaks" version 2>/dev/null || true)
          case "$gv" in
            "${GITLEAKS_VERSION:-}"|v"${GITLEAKS_VERSION:-}") ;;
            *) if [ -n "${GITLEAKS_VERSION:-}" ]; then echo "::error::expected gitleaks ${GITLEAKS_VERSION}, found '${gv}'"; exit 1; fi ;;
          esac
          # The commits this PR adds. None (the head is already on the base branch): nothing to scan.
          count=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          if [ "$count" -eq 0 ]; then echo "no commits to scan: $HEAD_SHA is already on the base branch"; exit 0; fi
          # gitleaks counts the commits git shows a diff for (a clean merge shows none under remerge), so
          # the expected count comes from the same git log it runs. --format prints only the marker line,
          # never the message, so a message cannot fake a marker or a diff header.
          # Streamed, never written: awk reads to the end, so pipefail sees git's own exit status.
          want=$(git log -p --text --diff-merges=remerge --format='CB-COMMIT %H' "$BASE_SHA..$HEAD_SHA" |
            awk '/^CB-COMMIT / { c = $2; next } /^diff --git / { if (!(c in seen)) { seen[c] = 1; n++ } } END { print n + 0 }')
          # The ruleset comes from the base branch, so a PR cannot loosen it for itself. Only the PR
          # that first adds .gitleaks.toml (none on the base commit, which exists) uses its own copy.
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" >"$RUNNER_TEMP/gitleaks.toml"; echo "ruleset: base branch"
          elif [ -f .gitleaks.toml ]; then
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
            echo "::warning::ruleset taken from this PR (.gitleaks.toml is not on the base branch yet): review it"
          else
            echo "::error::.gitleaks.toml is on neither the base branch nor this PR"; exit 1
          fi
          # A PR that changes the scan itself, or allows a finding, needs a reviewer's eye. Allowances
          # (.gitleaksignore, gitleaks:allow) come from the PR on purpose: that is how a false positive
          # is handled, in the open. The workflow file runs from the PR too; branch protection and
          # review are what keep it honest. Compared with the merge base: only the PR's own changes.
          mb=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || mb=$BASE_SHA   # unrelated histories: compare with the base
          git diff --name-only "$mb" "$HEAD_SHA" -- .gitleaksignore .gitleaks.toml .github/workflows/gitleaks.yml >"$RUNNER_TEMP/changed.txt"
          changed=$(tr '\n' ' ' <"$RUNNER_TEMP/changed.txt")
          if [ -n "$changed" ]; then
            echo "::warning::this PR changes the secret scan or its allowances; review them: $changed"
          fi
          # Only the scan's own files mention gitleaks:allow without allowing anything; anywhere else,
          # docs included, it is an allowance. --text: gitleaks scans binary files too. Streamed into a
          # count (awk reads to the end, unlike grep -q, so pipefail sees git's own exit status).
          allows=$(git diff --text "$mb" "$HEAD_SHA" -- . ':(exclude).gitleaks.toml' ':(exclude).github/workflows/gitleaks.yml' |
            awk '/^\+.*gitleaks:allow/ { n++ } END { print n + 0 }')
          if [ "$allows" -gt 0 ]; then
            echo "::warning::this PR adds a gitleaks:allow comment; review what it allows"
          fi
          # --text: scan files marked binary or -diff too. --diff-merges=remerge: a merge commit shows
          # only what it adds beyond merging its parents (an evil merge, a conflict resolution), not
          # what an already-merged base branch brings in; the PR's other commits are scanned anyway.
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v -c "$RUNNER_TEMP/gitleaks.toml" \
            --report-format json --report-path "$RUNNER_TEMP/report.json" \
            --log-opts="--text --diff-merges=remerge $BASE_SHA..$HEAD_SHA" . 2>"$RUNNER_TEMP/gitleaks.err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/gitleaks.err" >&2
          # gitleaks exits 0 when git fails or writes to stderr, so a pass needs proof the scan ran: no
          # ERR/FTL line, the log naming exactly the number of commits git shows a diff for, and a JSON
          # report. Anything else
          # fails, including a log format this step does not know (say, after a gitleaks upgrade). The
          # log is coloured even off a terminal: drop the colour codes (ESC from printf, which any sed
          # accepts) before matching.
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" "$RUNNER_TEMP/gitleaks.err" >"$RUNNER_TEMP/gitleaks.log"
          if [ "$rc" -eq 0 ]; then
            why=
            if grep -qE '(^|[[:space:]])(ERR|FTL)[[:space:]]' "$RUNNER_TEMP/gitleaks.log"; then why="gitleaks logged an error"
            elif ! grep -qE "(^|[^0-9])$want commits scanned" "$RUNNER_TEMP/gitleaks.log"; then
              got=$(awk 'match($0, /[0-9]+ commits scanned/) { print substr($0, RSTART, RLENGTH - 16); exit }' "$RUNNER_TEMP/gitleaks.log")
              why="gitleaks reported ${got:-no count of} commits scanned, git shows a diff for $want of the PR's $count (if gitleaks was upgraded, its log wording may have changed: see scripts/githooks/gitleaks-ci-scan.sh)"
            elif ! { tr -d ' \t\r\n' <"$RUNNER_TEMP/report.json" >"$RUNNER_TEMP/report.min"; } 2>/dev/null ||
                 ! grep -q '^\[.*\]$' "$RUNNER_TEMP/report.min"; then why="gitleaks wrote no report"
            fi
            if [ -n "$why" ]; then
              echo "::error::gitleaks did not scan this PR's commits: $why (see the log above)"; exit 1
            fi
          fi
          exit "$rc"
